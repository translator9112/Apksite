<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Downloads</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; }
        .app-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-btn {
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }
        .download-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Download My Shared Apps</h1>

    <div class="app-card">
        <div>
            <h3>My Application</h3>
            <p>Version 1.0</p>
        </div>
        <!-- Direct Download Link -->
        <a href="https://drive.google.com/uc?export=download&id=1DWg-JPNjr5OVgHfatv7XKW0Hp_a3-cuD" class="download-btn">Download</a>
    </div>

</body>
</html>
